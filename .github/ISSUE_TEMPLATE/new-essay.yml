name: Start a new essay
description: Propose a topic and initialize a 30-day draft with a chosen word range.
title: "[Essay] title here"
labels: ["new-essay"]
body:
  - type: input
    id: title
    attributes:
      label: Essay title
      placeholder: "On Deadlines and Honesty"
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: Topic / one-sentence premise
      placeholder: "The role of time pressure..."
    validations:
      required: true
  - type: dropdown
    id: word_range
    attributes:
      label: Word range
      options:
        - 250-500
        - 500-1000
        - 1000-1500
    validations:
      required: true
  - type: dropdown
    id: initial_status
    attributes:
      label: Initial status (for first publish versioning)
      options:
        - unfinished
        - complete
    validations:
      required: true
  - type: input
    id: started_at
    attributes:
      label: Started at (YYYY-MM-DD)
      placeholder: "2025-10-21"
    validations:
      required: true
  - type: input
    id: deadline_at
    attributes:
      label: Deadline at (YYYY-MM-DD, started_at + 30 days)
      placeholder: "2025-11-20"
    validations:
      required: true
