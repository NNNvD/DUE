name: Start a new essay
description: Propose a topic and initialize a 30-day draft with a chosen word range.
title: "[Essay] title here"
labels: ["new-essay"]
body:
  - type: input
    id: title
    attributes:
      label: Essay title
      placeholder: "On Deadlines and Honesty"
    validations:
      required: true
  - type: textarea
    id: topic
    attributes:
      label: Topic
      placeholder: e.g., The role of time pressure in clarity
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author (GitHub handle)
      placeholder: yourhandle
    validations:
      required: true
  - type: dropdown
    id: word_range
    attributes:
      label: Word range
      options:
        - 250-500
        - 500-1000
        - 1000-1500
      default: 500-1000
    validations:
      required: true
  - type: dropdown
    id: initial_status
    attributes:
      label: Initial status (for first publish versioning)
      options:
        - unfinished
        - complete
    validations:
      required: true
  - type: input
    id: started_at
    attributes:
      label: Start date (YYYY-MM-DD)
      description: Required to track drafting cadence.
    validations:
      required: true
  - type: input
    id: deadline_at
    attributes:
      label: Deadline date (YYYY-MM-DD)
      description: Typically 30 days after start
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: Any initial thoughts or links.

