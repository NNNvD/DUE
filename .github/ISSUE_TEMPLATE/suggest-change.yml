name: Suggest a change to an essay
description: Propose a minor (acknowledgment) or major (coauthor) contribution.
title: "[Suggest] short description"
labels: ["suggestion"]
body:
  - type: input
    id: essay_path
    attributes:
      label: Essay file path
      placeholder: site/essays/published/your-essay.md
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Contribution intent
      options:
        - minor
        - major
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      placeholder: "This adds an example that clarifies..."
    validations:
      required: true
  - type: textarea
    id: proposed_changes
    attributes:
      label: Proposed changes (Markdown or diff)
      placeholder: "## New paragraph..."
    validations:
      required: true
