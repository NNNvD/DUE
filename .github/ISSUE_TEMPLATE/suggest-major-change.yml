name: Suggest a major change to an essay
description: Propose structural edits or new sections that qualify for coauthorship.
title: "[Major] short description"
labels: ["suggestion", "major"]
body:
  - type: input
    id: essay_path
    attributes:
      label: Essay file path
      placeholder: site/essays/published/your-essay.md
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      placeholder: "This restructures the argument because..."
    validations:
      required: true
  - type: textarea
    id: proposed_changes
    attributes:
      label: Proposed changes (Markdown or diff)
      placeholder: "## Outline of new sections..."
    validations:
      required: true
