name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build_and_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Front matter schema check
        run: npm run check:frontmatter

      - name: Word range check
        run: npm run check:words

      - name: One active draft per author
        run: node scripts/checkActiveDrafts.js

      - name: Build
        run: npm run build
