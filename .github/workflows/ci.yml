name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build_and_checks:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --trace-uncaught --unhandled-rejections=strict
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund

      - name: Unit tests
        run: |
          set -euxo pipefail
          npm test

      - name: Front matter check
        run: |
          set -euxo pipefail
          npm run check:frontmatter

      - name: Overdue draft check
        run: |
          set -euxo pipefail
          npm run check:overdue

      - name: Validate release notes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          node scripts/checkReleaseNotes.js

      - name: Word range check
        run: |
          set -euxo pipefail
          npm run check:words

      - name: One active draft per author
        run: |
          set -euxo pipefail
          node scripts/checkActiveDrafts.js

      - name: Build
        run: |
          set -euxo pipefail
          npm run build

      - name: Accessibility report
        run: |
          set -euxo pipefail
          npm run check:a11y

      - name: Validate feeds
        run: |
          set -euxo pipefail
          npm run validate:feeds
