name: Deploy Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prefer the secret; fall back to a repository variable if the secret is not set.
      DECAP_OAUTH_BASE: ${{ secrets.DECAP_OAUTH_BASE || vars.DECAP_OAUTH_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note Decap OAuth base
        run: |
          if [ -z "${DECAP_OAUTH_BASE:-}" ]; then
            echo "::warning::DECAP_OAUTH_BASE is not set. Decap login will show a missing OAuth host until you configure it." >&2
          else
            echo "DECAP_OAUTH_BASE=${DECAP_OAUTH_BASE}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
