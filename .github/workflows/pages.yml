name: Deploy Pages

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: [ "Auto publish overdue drafts" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Prefer the secret; fall back to a repository variable if the secret is not set.
      DECAP_OAUTH_BASE: ${{ secrets.DECAP_OAUTH_BASE || vars.DECAP_OAUTH_BASE }}
      COMMENTS_ENDPOINT: ${{ secrets.COMMENTS_ENDPOINT || vars.COMMENTS_ENDPOINT }}
      COMMENTS_ISSUE_FALLBACK: ${{ secrets.COMMENTS_ISSUE_FALLBACK || vars.COMMENTS_ISSUE_FALLBACK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Note Decap OAuth base
        run: |
          echo "DECAP_OAUTH_BASE=${DECAP_OAUTH_BASE:-}" >> "$GITHUB_ENV"
          if [ -z "${DECAP_OAUTH_BASE:-}" ]; then
            echo "::warning::DECAP_OAUTH_BASE is not set. Decap login will show a missing OAuth host until you configure it." >&2
          else
            echo "Using DECAP_OAUTH_BASE=${DECAP_OAUTH_BASE}"
          fi

      - name: Note comment endpoint
        run: |
          echo "COMMENTS_ENDPOINT=${COMMENTS_ENDPOINT:-}" >> "$GITHUB_ENV"
          echo "COMMENTS_ISSUE_FALLBACK=${COMMENTS_ISSUE_FALLBACK:-}" >> "$GITHUB_ENV"
          if [ -z "${COMMENTS_ENDPOINT:-}" ]; then
            echo "::warning::COMMENTS_ENDPOINT is not set. The deployed site will fall back to the GitHub issue path instead of live comment submission." >&2
          else
            echo "Using COMMENTS_ENDPOINT=${COMMENTS_ENDPOINT}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build site
        env:
          # Forward to Eleventy and the Decap data helper in case the job env is not inherited automatically.
          DECAP_OAUTH_BASE: ${{ env.DECAP_OAUTH_BASE }}
          GITHUB_PAGES_DECAP_OAUTH_BASE: ${{ env.DECAP_OAUTH_BASE }}
          COMMENTS_ENDPOINT: ${{ env.COMMENTS_ENDPOINT }}
          COMMENTS_ISSUE_FALLBACK: ${{ env.COMMENTS_ISSUE_FALLBACK }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
