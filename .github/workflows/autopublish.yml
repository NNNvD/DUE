name: Auto publish overdue drafts

on:
  schedule:
    # Run throughout the day so deadline_at_time values do not wait until the
    # next UTC midnight to publish.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: autopublish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund

      - name: Run autopublish
        run: |
          set -euxo pipefail
          node scripts/autopublish.js
      - name: Advisory word-range check (non-blocking)
        run: |
          set -euxo pipefail
          if ! npm run check:words; then
            echo "::warning::Word-range check failed after autopublish. Draft promotion will still be committed."
          fi

      - name: Commit and push changes
        run: |
          set -euxo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: autopublish overdue drafts"
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          else
            echo "No changes to commit."
          fi
