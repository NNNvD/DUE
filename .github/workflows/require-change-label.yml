name: Require label for essay changes

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened, ready_for_review]

jobs:
  require-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check labels on changes to published essays
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );
            const touchesPublished = files.some(
              (f) => f.filename.startsWith('site/essays/published/') && f.filename.endsWith('.md')
            );
            if (!touchesPublished) {
              return;
            }
            const ok = labels.includes('minor') || labels.includes('major');
            if (!ok) {
              core.setFailed('PR modifies published essays but lacks required label: "minor" or "major".');
            }
