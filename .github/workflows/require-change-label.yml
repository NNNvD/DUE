name: Require label for essay changes

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

jobs:
  require-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect PR context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const labels = (pr.labels || []).map(label => ({ name: label.name }));
            const changed = files.map(file => file.filename).join("\n");
            const details = files.map(file => ({ filename: file.filename, patch: file.patch || "" }));
            core.setOutput("labels", JSON.stringify(labels));
            core.setOutput("changed", changed);
            core.setOutput("changed_details", JSON.stringify(details));

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require minor/major label for published essay edits
        run: node scripts/checkPublishedEssayLabels.js
        env:
          PR_LABELS: ${{ steps.context.outputs.labels }}
          CHANGED_FILES: ${{ steps.context.outputs.changed }}
          CHANGED_FILE_DETAILS: ${{ steps.context.outputs.changed_details }}
