name: Process CMS save

on:
  push:
    branches: ["main"]
    paths:
      - "site/essays/drafts/**"
      - "site/essays/published/**"

permissions:
  contents: write

concurrency:
  group: process-cms-save-main
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Process DUE CMS actions
        run: node scripts/processCmsSave.js

      - name: Refresh calculated word metadata
        run: npm run check:words -- --write

      - name: Validate essay metadata
        run: npm run check:frontmatter

      - name: Commit generated metadata and lifecycle changes
        run: |
          set -euxo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/essays
          git commit -m "chore: process CMS essay save"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
