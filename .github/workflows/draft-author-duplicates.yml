name: Draft author status check

on:
  pull_request:
    paths:
      - "site/essays/drafts/**"

jobs:
  draft-author-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check draft author duplicates
        run: node scripts/checkDraftStatusDuplicates.js
