<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUE CMS</title>
  <style>
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      padding: 8px 12px;
      background: #000;
      color: #fff;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 0;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" role="main">
    <h1>DUE CMS</h1>
    <div id="nc-root"></div>
  </main>
  <script>
    // Ensure the CMS loads the repo-local config.
    window.CMS_CONFIG_PATH = "config.yml";
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
