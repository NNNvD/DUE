backend:
  name: github
  branch: main
  repo: nnnvd/DUE
  base_url: https://sveltia-cms-auth.n-djaye.workers.dev/
media_folder: site/assets/uploads
public_folder: /DUE/assets/uploads
local_backend: true
site_url: https://nnnvd.github.io/DUE
collections:
  - name: drafts
    label: Draft essays
    label_singular: Draft essay
    folder: site/essays/drafts
    create: true
    slug: "{{slug}}"
    preview_path: "essays/drafts/{{slug}}/"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - label: Keywords
        name: keywords
        widget: list
        summary: "Keyword: {{fields.item}}"
        field: { label: Keyword, name: item, widget: string, pattern: ["^.{0,100}$", "Keyword must be under 100 characters"] }
        allow_add: true
        required: false
        hint: "Use specific terms someone might search for. Usually 3–6 keywords are enough."
      - { label: Legacy topic, name: topic, widget: hidden, required: false, default: "" }
      - label: Themes
        name: themes
        widget: select
        options: [deadlines, iteration, publishing, collaboration, quality, process, scope, authorship, feedback, revision]
        multiple: true
        required: false
        hint: "Themes are broad DUE categories used for browsing; keywords are specific searchable terms."
      - label: Author
        name: author
        widget: select
        options:
          - { label: "Noah van Dongen", value: "noahvandongen" }
          - { label: "Floor Bevaart", value: "Floor Bevaart" }
          - { label: "Josjan Zijlmans", value: "Josjan Zijlmans" }
        required: true
      - label: Coauthors
        name: coauthors
        widget: list
        summary: "{{fields.item}}"
        field: { label: Coauthor, name: item, widget: string }
        allow_add: true
        required: false
        hint: "Add someone only if they should be credited as an author of the essay. Leave this empty for a single-author essay."
      - label: Acknowledgments
        name: acknowledgments
        widget: list
        summary: "@{{fields.user}}"
        collapsed: true
        fields:
          - { label: User, name: user, widget: string, required: true }
          - { label: Note, name: note, widget: string, required: false }
          - { label: Since version, name: since_version, widget: string, required: false }
        required: false
        hint: "Use acknowledgments for people who contributed without qualifying as authors, for example through comments, suggestions, editing, or discussion."
      - { label: Status, name: status, widget: hidden, default: proposed }
      - { label: Initial status, name: initial_status, widget: hidden, default: unfinished }
      - { label: Started at, name: started_at, widget: hidden, required: true }
      - { label: Proposed at, name: proposed_at, widget: hidden, required: false }
      - { label: Days until publication, name: publication_countdown, widget: countdown, required: false }
      - { label: Deadline at, name: deadline_at, widget: hidden, required: true }
      - { label: Version, name: version, widget: hidden, default: "0.1.0" }
      - { label: Word range, name: word_range, widget: hidden, default: "500-1000" }
      - { label: Word count, name: word_count, widget: hidden, required: false }
      - { label: Release notes, name: release_notes, widget: hidden, required: false, default: [] }
      - label: Publish essay
        name: publish_now
        widget: publish-action
        required: false
        default: false
      - { label: Body, name: body, widget: markdown }
  - name: published
    label: Published essays
    folder: site/essays/published
    create: false
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - label: Keywords
        name: keywords
        widget: list
        summary: "Keyword: {{fields.item}}"
        field: { label: Keyword, name: item, widget: string }
        allow_add: true
        required: false
        hint: "Use specific terms someone might search for. Usually 3–6 keywords are enough."
      - { label: Legacy topic, name: topic, widget: hidden, required: false, default: "" }
      - label: Themes
        name: themes
        widget: select
        options: [deadlines, iteration, publishing, collaboration, quality, process, scope, authorship, feedback, revision]
        multiple: true
        required: false
        hint: "Themes are broad DUE categories used for browsing; keywords are specific searchable terms."
      - label: Author
        name: author
        widget: select
        options:
          - { label: "Noah van Dongen", value: "noahvandongen" }
          - { label: "Floor Bevaart", value: "Floor Bevaart" }
          - { label: "Josjan Zijlmans", value: "Josjan Zijlmans" }
        required: true
      - label: Coauthors
        name: coauthors
        widget: list
        summary: "{{fields.item}}"
        field: { label: Coauthor, name: item, widget: string }
        allow_add: true
        required: false
        hint: "Add someone only if they should be credited as an author of the essay. Leave this empty for a single-author essay."
      - label: Acknowledgments
        name: acknowledgments
        widget: list
        summary: "@{{fields.user}}"
        collapsed: true
        fields:
          - { label: User, name: user, widget: string, required: true }
          - { label: Note, name: note, widget: string, required: false }
          - { label: Since version, name: since_version, widget: string, required: false }
        required: false
        hint: "Use acknowledgments for people who contributed without qualifying as authors, for example through comments, suggestions, editing, or discussion."
      - { label: Status, name: status, widget: hidden, default: published }
      - { label: Initial status, name: initial_status, widget: hidden, default: complete }
      - { label: Started at, name: started_at, widget: hidden, required: true }
      - { label: Proposed at, name: proposed_at, widget: hidden, required: false }
      - { label: Deadline at, name: deadline_at, widget: hidden, required: true }
      - { label: Deadline time, name: deadline_at_time, widget: hidden, required: false }
      - { label: Published at, name: published_at, widget: hidden, required: true }
      - label: Update level
        name: update_intent
        widget: select
        options:
          - { label: "Small correction (1.0.0 → 1.0.1)", value: minor_update }
          - { label: "Substantive revision (1.0.x → 1.1.0)", value: major_update }
          - { label: "New edition (1.x.x → 2.0.0)", value: new_version }
        default: minor_update
        hint: "Choose Small correction for local wording, typo, formatting, or clarification changes; Substantive revision when the argument, examples, sections, or interpretation materially change; New edition when the essay is substantially reconceived."
      - label: What changed?
        name: update_note
        widget: string
        required: false
        hint: "Briefly describe changes readers may want to know about. You can leave this empty for spelling, punctuation, formatting, or similarly trivial corrections. Examples: ‘Clarified the argument about peer review.’ ‘Added a paragraph on research synthesis.’ ‘Revised the conclusion in response to new evidence.’"
      - { label: Version, name: version, widget: hidden, default: "1.0.0" }
      - { label: Word range, name: word_range, widget: hidden, default: "500-1000" }
      - { label: Word count, name: word_count, widget: hidden, required: false }
      - { label: Release notes, name: release_notes, widget: hidden, required: false, default: [] }
      - { label: Canonical URL, name: canonical_url, widget: hidden, required: false }
      - { label: Social image, name: social_image, widget: hidden, required: false }
      - { label: Permalink override, name: permalink, widget: hidden, required: false }
      - { label: Update pending, name: update_pending, widget: hidden, required: false, default: false }
      - { label: Body, name: body, widget: markdown }
